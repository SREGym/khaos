name: Build and Push Docker Images

on:
  push:
    branches: [ main, I32 ]
  pull_request:
    branches: [ main, I32 ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          clang \
          llvm \
          gcc \
          make \
          libelf-dev \
          zlib1g-dev \
          linux-headers-$(uname -r) \
          build-essential \
          pkg-config \
          linux-tools-common \
          gcc-aarch64-linux-gnu

    - name: Setup kernel headers
      run: |
        # Check what kernel headers are available
        ls -la /usr/src/
        ls -la /usr/include/
        
        # Try different approaches to fix asm headers
        if [ -d "/usr/src/linux-headers-$(uname -r)/arch/x86/include/uapi/asm" ]; then
          sudo ln -sf /usr/src/linux-headers-$(uname -r)/arch/x86/include/uapi/asm /usr/include/asm
        elif [ -d "/usr/src/linux-headers-$(uname -r)/include/uapi/asm" ]; then
          sudo ln -sf /usr/src/linux-headers-$(uname -r)/include/uapi/asm /usr/include/asm
        else
          # Fallback: create a minimal asm/types.h
          sudo mkdir -p /usr/include/asm
          echo '#include <linux/types.h>' | sudo tee /usr/include/asm/types.h
        fi
        
        # Verify the fix
        ls -la /usr/include/asm
        cat /usr/include/asm/types.h || echo "No types.h found"

    - name: Build libbpf
      run: |
        cd libbpf/src
        sudo make install

    - name: Build project artifacts
      run: |
        # Build for x86_64
        make clean
        make ARCH=x86
        # Verify build artifacts exist
        ls -la khaos kprobe.bpf.o kretprobe.bpf.o kprobe.skel.h kretprobe.skel.h

    - name: Build and push Docker images
      if: github.event_name != 'pull_request'
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ghcr.io/${{ github.repository }}:latest
          ghcr.io/${{ github.repository }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
